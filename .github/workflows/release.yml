name: release

# 发布 GitHub Release 时，用该 release 的 tag 校验清单版本，再按版本号推导 dist-tag 发到 npm。
# Publishing a GitHub Release validates its tag against the manifest version and
# then publishes to npm with the dist-tag derived from that version.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "release tag:     ${TAG}"
          echo "package version: ${version}"
          if [ "${TAG}" != "${version}" ] && [ "${TAG}" != "v${version}" ]; then
            echo "::error::release tag '${TAG}' does not match package.json version '${version}'. Bump package.json, rebuild, commit, then create the release for v${version}."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Committed artifacts are current
        run: node scripts/build.mjs --check

      - name: Tests
        run: pnpm test

      - name: Refuse to republish an existing version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${name}@${version} is already on npm; bump the version instead of republishing."
            exit 1
          fi

      - name: Derive the npm dist-tag
        id: dist-tag
        run: echo "tag=$(node scripts/dist-tag.mjs)" >> "${GITHUB_OUTPUT}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "publishing $(node -p "require('./package.json').name + '@' + require('./package.json').version") with dist-tag ${{ steps.dist-tag.outputs.tag }}"
          npm publish --tag "${{ steps.dist-tag.outputs.tag }}"
